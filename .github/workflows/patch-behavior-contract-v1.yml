name: Patch behavior contract v1

on:
  push:
    branches: ["fix/behavior-contract-v1"]
    paths:
      - "docs/BEHAVIOR_PATCH_TRIGGER.md"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/behavior-contract-v1

      - name: Apply behavior contract patch
        shell: bash
        run: python3 tools/patch_behavior_contract_v1.py

      - name: Commit patched runtime sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hldm_weapon_comedy.sma src/hldm_weapon_lab.sma src/hldm_hornet_policy.sma configs/plugins/hldm_weapon_comedy.cfg configs/plugins/hldm_weapon_lab.cfg configs/plugins/hldm_hornet_policy.cfg
          git commit -m "Align weapon behavior with runtime ownership contract"
          git push origin HEAD:fix/behavior-contract-v1
