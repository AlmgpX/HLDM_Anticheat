name: Fix Hornet Gun runtime

on:
  push:
    branches: ["fix/hornetgun-runtime-v1.1"]
    paths:
      - "docs/HORNET_RUNTIME_FIX_TRIGGER.md"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hornetgun-runtime-v1.1

      - name: Patch native Hornet Gun tracking and explosions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/hldm_weapon_lab.sma")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '#define PLUGIN_VERSION "1.0.0"',
                  '#define PLUGIN_VERSION "1.1.0"',
              ),
              (
                  '    register_concmd("amx_quiet_status", "CmdQuietStatus", ADMIN_RCON, "- list silent punishment state");\n',
                  '    register_concmd("amx_quiet_status", "CmdQuietStatus", ADMIN_RCON, "- list silent punishment state");\n'
                  '    register_concmd("amx_weaponlab_hornets", "CmdHornetStatus", ADMIN_RCON, "- show active and tagged hornets");\n',
              ),
              (
                  '    register_forward(FM_Touch, "OnEntityTouch", false);\n',
                  '    register_forward(FM_Touch, "OnEntityTouch", false);\n'
                  '    register_forward(FM_Think, "OnEntityThinkPre", false);\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Required anchor missing: {old!r}")
              text = text.replace(old, new, 1)

          old = '''    if (equal(classname, "grenade") && containi(model, "grenade") >= 0)
    {
        if (pev(entity, pev_iuser3) != TAG_GRENADE)
        {
            TagEntity(entity, TAG_GRENADE, 0.0);
        }
    }

    return FMRES_IGNORED;
}

public OnEntityTouch'''

          new = '''    if (equal(classname, "hornet") || equali(model, "models/hornet.mdl"))
    {
        // Native Hornet Gun projectiles are most reliable here: the SDK has
        // already assigned pev_owner before Spawn(), and SET_MODEL happens
        // during CHornet::Spawn. FM_Spawn alone was not reliable on the
        // current Steam listen-server path.
        EnsureHornetTagged(entity);
    }
    else if (equal(classname, "grenade") && containi(model, "grenade") >= 0)
    {
        if (pev(entity, pev_iuser3) != TAG_GRENADE)
        {
            TagEntity(entity, TAG_GRENADE, 0.0);
        }
    }

    return FMRES_IGNORED;
}

public OnEntityThinkPre(entity)
{
    if (!get_pcvar_num(g_pcvarEnabled) || !pev_valid(entity))
    {
        return FMRES_IGNORED;
    }

    new classname[24];
    pev(entity, pev_classname, classname, charsmax(classname));
    if (!equal(classname, "hornet"))
    {
        return FMRES_IGNORED;
    }

    EnsureHornetTagged(entity);

    new Float:expireTime;
    pev(entity, pev_fuser3, expireTime);
    if (expireTime > 0.0 && get_gametime() >= expireTime)
    {
        ExplodeHornet(entity);
        return FMRES_SUPERCEDE;
    }

    return FMRES_IGNORED;
}

public OnEntityTouch'''

          if old not in text:
              raise SystemExit("OnSetModelPost anchor missing")
          text = text.replace(old, new, 1)

          old = '''public CmdQuietStatus(id, level, cid)
{
    if (!cmd_access(id, level, cid, 1))
    {
        return PLUGIN_HANDLED;
    }

    console_print(id, "[WEAPON LAB] quiet punishment state:");
    for (new target = 1; target <= MaxClients; target++)
    {
        if (!is_user_connected(target) || !g_quietMask[target])
        {
            continue;
        }

        new name[32], authid[40];
        get_user_name(target, name, charsmax(name));
        get_user_authid(target, authid, charsmax(authid));
        console_print(id, "  #%d %s <%s> mask=%d", get_user_userid(target), name, authid, g_quietMask[target]);
    }

    return PLUGIN_HANDLED;
}

public QuietTargetMenuHandler'''

          new = '''public CmdQuietStatus(id, level, cid)
{
    if (!cmd_access(id, level, cid, 1))
    {
        return PLUGIN_HANDLED;
    }

    console_print(id, "[WEAPON LAB] quiet punishment state:");
    for (new target = 1; target <= MaxClients; target++)
    {
        if (!is_user_connected(target) || !g_quietMask[target])
        {
            continue;
        }

        new name[32], authid[40];
        get_user_name(target, name, charsmax(name));
        get_user_authid(target, authid, charsmax(authid));
        console_print(id, "  #%d %s <%s> mask=%d", get_user_userid(target), name, authid, g_quietMask[target]);
    }

