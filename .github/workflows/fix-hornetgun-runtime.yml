'''

          new = '''stock ProcessHornets(Float:now)
{
    new entity = -1;
    while ((entity = engfunc(EngFunc_FindEntityByString, entity, "classname", "hornet")) > 0)
    {
        if (!pev_valid(entity))
        {
            continue;
        }

        // Late discovery is intentional. Native Hornet Gun projectiles were
        // escaping the FM_Spawn-only tag path on the Steam listen server,
        // while hornets created manually by Egon were tagged explicitly.
        EnsureHornetTagged(entity);

        if (!pev_valid(entity) || pev(entity, pev_iuser3) != TAG_HORNET)
        {
            continue;
        }

        new owner = GetTaggedOwner(entity);
        new Float:expireTime;
        pev(entity, pev_fuser3, expireTime);

        // Fallback for a stock hornet whose own DieTouch already hid it before
        // the metamod touch hook saw it. Convert that silent removal into the
        // requested mini explosion.
        if (pev(entity, pev_modelindex) == 0 || pev(entity, pev_solid) == SOLID_NOT)
        {
            ExplodeHornet(entity);
            continue;
        }

        if (expireTime > 0.0 && now >= expireTime)
        {
            ExplodeHornet(entity);
            continue;
        }

        if (owner >= 1
            && owner <= MaxClients
            && is_user_alive(owner)
            && (g_quietMask[owner] & QUIET_BETRAYAL))
        {
            SteerEntityToward(entity, owner, 720.0, 28.0);
            set_pev(entity, pev_owner, 0);
        }
    }
}
'''

          if old not in text:
              raise SystemExit("ProcessHornets anchor missing")
          text = text.replace(old, new, 1)

          old = '''stock TagHornet(entity)
{
    TagEntity(entity, TAG_HORNET, 0.0);

    new Float:now = get_gametime();
    set_pev(entity, pev_fuser2, now);
    set_pev(entity, pev_fuser3, now + ClampFloat(get_pcvar_float(g_pcvarHornetLifetime), 0.4, 10.0));

    EnforceHornetLimit(GetTaggedOwner(entity));
}
'''

          new = '''stock EnsureHornetTagged(entity)
{
    if (!pev_valid(entity) || pev(entity, pev_iuser3) == TAG_HORNET)
    {
        return;
    }

    TagHornet(entity);
}

stock TagHornet(entity)
{
    if (!pev_valid(entity))
    {
        return;
    }

    new owner = pev(entity, pev_owner);
    if (owner < 1 || owner > MaxClients || !is_user_connected(owner))
    {
        owner = InferHornetOwner(entity);
    }

    set_pev(entity, pev_iuser3, TAG_HORNET);
    set_pev(entity, pev_iuser2, owner);

    new Float:now = get_gametime();
    set_pev(entity, pev_fuser2, now);
    set_pev(entity, pev_fuser3, now + ClampFloat(get_pcvar_float(g_pcvarHornetLifetime), 0.4, 10.0));

    EnforceHornetLimit(owner);
}

stock InferHornetOwner(entity)
{
    if (!pev_valid(entity))
    {
        return 0;
    }

    new Float:hornetOrigin[3];
    pev(entity, pev_origin, hornetOrigin);

    new bestPlayer;
    new Float:bestDistanceSquared = 160.0 * 160.0;
    for (new player = 1; player <= MaxClients; player++)
    {
        if (!is_user_alive(player) || get_user_weapon(player) != W_HORNETGUN)
        {
            continue;
        }

        new Float:playerOrigin[3];
        pev(player, pev_origin, playerOrigin);
        new Float:distanceSquared = VectorDistanceSquared(hornetOrigin, playerOrigin);
        if (distanceSquared < bestDistanceSquared)
        {
            bestDistanceSquared = distanceSquared;
            bestPlayer = player;
        }
    }

    return bestPlayer;
}
'''

          if old not in text:
              raise SystemExit("TagHornet anchor missing")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

          cfg = Path("configs/plugins/hldm_weapon_lab.cfg")
          cfg_text = cfg.read_text(encoding="utf-8")
          cfg_text = cfg_text.replace("// HLDM Weapon Lab 1.0.0", "// HLDM Weapon Lab 1.1.0", 1)
          cfg.write_text(cfg_text, encoding="utf-8", newline="\n")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hldm_weapon_lab.sma configs/plugins/hldm_weapon_lab.cfg
          git commit -m "Fix native Hornet Gun tagging, cap and explosions"
          git push origin HEAD:fix/hornetgun-runtime-v1.1
