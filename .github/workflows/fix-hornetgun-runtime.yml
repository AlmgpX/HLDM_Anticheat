public CmdHornetStatus(id, level, cid)
{
    if (!cmd_access(id, level, cid, 1))
    {
        return PLUGIN_HANDLED;
    }

    new total, tagged, untagged;
    new perOwner[MAX_PLAYERS + 1];
    new entity = -1;

    while ((entity = engfunc(EngFunc_FindEntityByString, entity, "classname", "hornet")) > 0)
    {
        if (!pev_valid(entity))
        {
            continue;
        }

        total++;
        if (pev(entity, pev_iuser3) == TAG_HORNET)
        {
            tagged++;
            new owner = GetTaggedOwner(entity);
            if (owner >= 1 && owner <= MaxClients)
            {
                perOwner[owner]++;
            }
        }
        else
        {
            untagged++;
        }
    }

    console_print(id, "[WEAPON LAB] hornets total=%d tagged=%d untagged=%d max=%d", total, tagged, untagged, ClampInt(get_pcvar_num(g_pcvarHornetMax), 1, 32));
    for (new owner = 1; owner <= MaxClients; owner++)
    {
        if (!perOwner[owner])
        {
            continue;
        }

        new name[32];
        get_user_name(owner, name, charsmax(name));
        console_print(id, "  #%d %s active hornets=%d", get_user_userid(owner), name, perOwner[owner]);
    }

    return PLUGIN_HANDLED;
}

public QuietTargetMenuHandler'''

          if old not in text:
              raise SystemExit("CmdQuietStatus anchor missing")
          text = text.replace(old, new, 1)

          old = '''stock ProcessHornets(Float:now)
{
    new entity = -1;
    while ((entity = engfunc(EngFunc_FindEntityByString, entity, "classname", "hornet")) > 0)
    {
