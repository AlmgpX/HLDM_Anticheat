name: Patch docs behavior v1

on:
  push:
    branches: ["fix/behavior-contract-v1"]
    paths:
      - "docs/DOCS_BEHAVIOR_PATCH_TRIGGER.md"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/behavior-contract-v1

      - name: Align documentation with runtime contract
        shell: bash
        run: python3 tools/patch_docs_behavior_v1.py

      - name: Commit documentation alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_EN.md README_ES.md CHANGELOG.md docs/INSTALL_RU.md docs/INSTALL_EN.md docs/INSTALL_ES.md
          git commit -m "Synchronize docs with runtime behavior contract"
          git push origin HEAD:fix/behavior-contract-v1
