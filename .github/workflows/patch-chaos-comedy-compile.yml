name: Patch Chaos Comedy compile

on:
  push:
    branches: ["feature/chaos-comedy-v2"]
    paths:
      - "docs/CHAOS_COMEDY_COMPILE_TRIGGER.md"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chaos-comedy-v2

      - name: Repair Pawn compiler issues
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          weapon = Path("src/hldm_weapon_comedy.sma")
          text = weapon.read_text(encoding="utf-8")
          text, count = re.subn(r"\bforward\b", "forwardVector", text)
          if count < 5:
              raise SystemExit(f"Expected forward token replacements, found {count}")
          weapon.write_text(text, encoding="utf-8", newline="\n")

          population = Path("src/hldm_population_manager.sma")
          text = population.read_text(encoding="utf-8")
          old_bot = '    set_task(12.0, "TaskPopulation", TASK_POPULATION, _, _, "b");\n'
          new_bot = '    set_task(ClampFloat(get_pcvar_float(g_pcvarBotInterval), 2.0, 60.0), "TaskPopulation", TASK_POPULATION, _, _, "b");\n'
          old_monster = '    set_task(20.0, "TaskMonsters", TASK_MONSTERS, _, _, "b");\n'
          new_monster = '    set_task(ClampFloat(get_pcvar_float(g_pcvarMonsterInterval), 4.0, 120.0), "TaskMonsters", TASK_MONSTERS, _, _, "b");\n'
          if old_bot not in text or old_monster not in text:
              raise SystemExit("Population task anchors not found")
          text = text.replace(old_bot, new_bot, 1).replace(old_monster, new_monster, 1)
          population.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hldm_weapon_comedy.sma src/hldm_population_manager.sma
          git commit -m "Fix Chaos Comedy Pawn compilation"
          git push origin HEAD:feature/chaos-comedy-v2
