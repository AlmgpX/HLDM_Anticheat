name: Compile AMXX

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AMXX_BUILD: "5479"
  AMXX_TAG: "1.10.0.5479"
  AMXX_ARCHIVE: "amxmodx-1.10.0-git5479-base-windows.zip"
  PLUGIN_VERSION: "1.0.0"

jobs:
  compile:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository contract and PowerShell parse
        shell: pwsh
        run: |
          python -m py_compile tools/check_contract.py
          python tools/check_contract.py

          $parseErrors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                  $parseErrors += $errors
              }
          }

          if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
              throw "PowerShell parse errors found."
          }

      - name: Download official AMX Mod X compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $primary = "https://github.com/alliedmodders/amxmodx/releases/download/$env:AMXX_TAG/$env:AMXX_ARCHIVE"
          $fallback = "https://www.amxmodx.org/amxxdrop/1.10/$env:AMXX_ARCHIVE"
          $archive = Join-Path $env:RUNNER_TEMP "amxx.zip"

          try {
              Invoke-WebRequest -Uri $primary -OutFile $archive
          } catch {
              Write-Warning "Primary download failed; using amxmodx.org fallback."
              Invoke-WebRequest -Uri $fallback -OutFile $archive
          }

          if (-not (Test-Path $archive -PathType Leaf) -or (Get-Item $archive).Length -le 0) {
              throw "AMXX archive was not downloaded correctly."
          }

          New-Item -ItemType Directory -Path .amxx -Force | Out-Null
          Expand-Archive -Path $archive -DestinationPath .amxx -Force

          $compiler = Join-Path $PWD ".amxx\addons\amxmodx\scripting\amxxpc.exe"
          if (-not (Test-Path $compiler -PathType Leaf)) {
              throw "Compiler not found: $compiler"
          }

      - name: Compile all plugins without warnings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scripting = Join-Path $PWD ".amxx\addons\amxmodx\scripting"
          $compiler = Join-Path $scripting "amxxpc.exe"
          $log = Join-Path $PWD "build-compiler.log"

          Remove-Item $log -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path build -Force | Out-Null

          $sources = Get-ChildItem "src\*.sma" | Sort-Object Name
          if ($sources.Count -lt 2) {
              throw "Expected at least trap and detector sources."
          }

          foreach ($sourceFile in $sources) {
              $name = $sourceFile.BaseName
              $temporarySource = Join-Path $scripting $sourceFile.Name
              $temporaryOutput = Join-Path $scripting "$name.amxx"

              Copy-Item $sourceFile.FullName $temporarySource -Force
              Remove-Item $temporaryOutput -Force -ErrorAction SilentlyContinue

              Push-Location $scripting
              try {
                  "===== $($sourceFile.Name) =====" | Tee-Object -FilePath $log -Append
                  & $compiler $sourceFile.Name "-o$name.amxx" 2>&1 | Tee-Object -FilePath $log -Append
                  if ($LASTEXITCODE -ne 0) {
                      throw "AMXX compiler returned exit code $LASTEXITCODE for $($sourceFile.Name)"
                  }
              } finally {
                  Pop-Location
              }

              if (-not (Test-Path $temporaryOutput -PathType Leaf) -or (Get-Item $temporaryOutput).Length -le 0) {
                  throw "Compiler did not produce a non-empty plugin: $temporaryOutput"
              }

              Copy-Item $temporaryOutput "build\$name.amxx" -Force
          }

          if (Select-String -Path $log -Pattern '\bwarning\s+\d+:' -Quiet) {
              Get-Content $log
              throw "Pawn compiler warnings are not allowed."
          }

      - name: Build install package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $PWD "package"
          Remove-Item $package -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path "$package\addons\amxmodx\plugins" -Force | Out-Null
          New-Item -ItemType Directory -Path "$package\addons\amxmodx\configs\plugins" -Force | Out-Null
          New-Item -ItemType Directory -Path "$package\deploy" -Force | Out-Null
          New-Item -ItemType Directory -Path "$package\docs" -Force | Out-Null

          Copy-Item "build\*.amxx" "$package\addons\amxmodx\plugins\"
          Copy-Item "configs\plugins\*.cfg" "$package\addons\amxmodx\configs\plugins\"
          Copy-Item "deploy\*.ps1" "$package\deploy\"
          Copy-Item README*.md, CHANGELOG.md, LICENSE $package
          Copy-Item "docs\*.md" "$package\docs\"

          $zip = "build\hldm-anticheat-$env:PLUGIN_VERSION.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$package\*" -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip -PathType Leaf) -or (Get-Item $zip).Length -le 0) {
              throw "Install ZIP was not created."
          }

      - name: Upload plugins and package
        uses: actions/upload-artifact@v4
        with:
          name: hldm-anticheat-${{ env.PLUGIN_VERSION }}-amxx-${{ env.AMXX_BUILD }}
          path: |
            build/*.amxx
            build/hldm-anticheat-${{ env.PLUGIN_VERSION }}.zip
            build-compiler.log
          if-no-files-found: error
