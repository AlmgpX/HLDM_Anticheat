name: Compile AMXX

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AMXX_BUILD: "5479"
  AMXX_TAG: "1.10.0.5479"
  AMXX_ARCHIVE: "amxmodx-1.10.0-git5479-base-windows.zip"
  PLUGIN_VERSION: "0.2.0"

jobs:
  compile:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository contract
        shell: pwsh
        run: |
          python -m py_compile tools/check_contract.py
          python tools/check_contract.py

      - name: Download official AMX Mod X compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $primary = "https://github.com/alliedmodders/amxmodx/releases/download/$env:AMXX_TAG/$env:AMXX_ARCHIVE"
          $fallback = "https://www.amxmodx.org/amxxdrop/1.10/$env:AMXX_ARCHIVE"
          $archive = Join-Path $env:RUNNER_TEMP "amxx.zip"

          try {
              Invoke-WebRequest -Uri $primary -OutFile $archive
          } catch {
              Write-Warning "Primary download failed; using amxmodx.org fallback."
              Invoke-WebRequest -Uri $fallback -OutFile $archive
          }

          if (-not (Test-Path $archive -PathType Leaf) -or (Get-Item $archive).Length -le 0) {
              throw "AMXX archive was not downloaded correctly."
          }

          New-Item -ItemType Directory -Path .amxx -Force | Out-Null
          Expand-Archive -Path $archive -DestinationPath .amxx -Force

          $compiler = Join-Path $PWD ".amxx\addons\amxmodx\scripting\amxxpc.exe"
          if (-not (Test-Path $compiler -PathType Leaf)) {
              throw "Compiler not found: $compiler"
          }

      - name: Compile plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scripting = Join-Path $PWD ".amxx\addons\amxmodx\scripting"
          $compiler = Join-Path $scripting "amxxpc.exe"
          $source = Join-Path $scripting "hldm_trap.sma"
          $output = Join-Path $scripting "hldm_trap.amxx"
          $log = Join-Path $PWD "build-compiler.log"

          Copy-Item "src\hldm_trap.sma" $source -Force
          Push-Location $scripting
          try {
              & $compiler "hldm_trap.sma" "-ohldm_trap.amxx" 2>&1 | Tee-Object -FilePath $log
              if ($LASTEXITCODE -ne 0) {
                  throw "AMXX compiler returned exit code $LASTEXITCODE"
              }
          } finally {
              Pop-Location
          }

          if (-not (Test-Path $output -PathType Leaf) -or (Get-Item $output).Length -le 0) {
              throw "Compiler did not produce a non-empty plugin: $output"
          }

          New-Item -ItemType Directory -Path build -Force | Out-Null
          Copy-Item $output "build\hldm_trap.amxx" -Force

      - name: Build install package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $PWD "package"
          Remove-Item $package -Recurse -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Path "$package\addons\amxmodx\plugins" -Force | Out-Null
          New-Item -ItemType Directory -Path "$package\addons\amxmodx\configs\plugins" -Force | Out-Null
          New-Item -ItemType Directory -Path "$package\docs" -Force | Out-Null

          Copy-Item "build\hldm_trap.amxx" "$package\addons\amxmodx\plugins\"
          Copy-Item "configs\plugins\hldm_trap.cfg" "$package\addons\amxmodx\configs\plugins\"
          Copy-Item README.md, CHANGELOG.md, LICENSE $package
          Copy-Item "docs\INSTALL_RU.md", "docs\TEST_PLAN.md" "$package\docs\"

          $zip = "build\hldm-anticheat-$env:PLUGIN_VERSION.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$package\*" -DestinationPath $zip -CompressionLevel Optimal

          if (-not (Test-Path $zip -PathType Leaf) -or (Get-Item $zip).Length -le 0) {
              throw "Install ZIP was not created."
          }

      - name: Upload plugin and package
        uses: actions/upload-artifact@v4
        with:
          name: hldm-anticheat-${{ env.PLUGIN_VERSION }}-amxx-${{ env.AMXX_BUILD }}
          path: |
            build/hldm_trap.amxx
            build/hldm-anticheat-${{ env.PLUGIN_VERSION }}.zip
            build-compiler.log
          if-no-files-found: error
