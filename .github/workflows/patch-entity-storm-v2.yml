name: Patch entity storm v2

on:
  push:
    branches: ["hotfix/entity-storm-v2"]
    paths:
      - "docs/ENTITY_STORM_PATCH_TRIGGER.md"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/entity-storm-v2

      - name: Patch rocket flood and duplicate hornet ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Missing anchor: {label}")
              return text.replace(old, new, 1)

          # ---------------- Weapon Comedy ----------------
          path = Path("src/hldm_weapon_comedy.sma")
          text = path.read_text(encoding="utf-8")

          text = replace_once(text, '#define PLUGIN_VERSION "2.0.0"', '#define PLUGIN_VERSION "2.1.0"', 'weapon comedy version')
          text = replace_once(
              text,
              'new Float:g_secondRocketTime[33];\n',
              'new Float:g_secondRocketTime[33];\nnew Float:g_lastRocketVolley[33];\n',
              'rocket volley state',
          )
          text = replace_once(
              text,
              'new g_pcvarRocketRadius;\n',
              'new g_pcvarRocketRadius;\nnew g_pcvarRocketCooldown;\nnew g_pcvarRocketMaxActive;\n',
              'rocket safety cvars',
          )
          text = replace_once(
              text,
              '    g_pcvarRocketRadius = register_cvar("hldm_weaponcomedy_rocket_radius", "180.0");\n',
              '    g_pcvarRocketRadius = register_cvar("hldm_weaponcomedy_rocket_radius", "180.0");\n'
              '    g_pcvarRocketCooldown = register_cvar("hldm_weaponcomedy_rocket_cooldown", "1.25");\n'
              '    g_pcvarRocketMaxActive = register_cvar("hldm_weaponcomedy_rocket_max_active", "4");\n',
              'rocket safety registration',
          )

          old_cmd = '''    new buttons = get_uc(userCmd, UC_Buttons);
    new pressed = buttons & ~g_previousButtons[id];
    new weapon = get_user_weapon(id);
    new Float:now = get_gametime();

    if (weapon == W_PYTHON && (pressed & IN_ATTACK))
    {
        FirePythonScatter(id);
    }
    else if (weapon == W_MP5 && (pressed & IN_ATTACK2))
    {
        buttons &= ~IN_ATTACK2;
        set_uc(userCmd, UC_Buttons, buttons);

        SpawnHomingRocket(id, 0.0);
        g_secondRocketPending[id] = true;
        g_secondRocketTime[id] = now + ClampFloat(get_pcvar_float(g_pcvarRocketDelay), 0.10, 1.5);
        ShowFactoryLine(id);
    }
    else if (weapon == W_GAUSS && (pressed & IN_ATTACK2))
    {
        g_gaussCorrectionPending[id] = true;
        g_gaussCorrectionTime[id] = now + 0.04;
        ShowFactoryLine(id);
    }

    g_previousButtons[id] = buttons;
'''

          new_cmd = '''    new rawButtons = get_uc(userCmd, UC_Buttons);
    new buttons = rawButtons;
    new pressed = rawButtons & ~g_previousButtons[id];
    new weapon = get_user_weapon(id);
    new Float:now = get_gametime();

    if (weapon == W_PYTHON && (pressed & IN_ATTACK))
    {
        FirePythonScatter(id);
    }
    else if (weapon == W_MP5 && (pressed & IN_ATTACK2))
    {
        // Suppress the stock grenade exactly once, but remember the original
        // button state. The previous code stored the cleared bit, so holding
        // attack2 looked like a fresh press every frame and created a rocket storm.
        buttons &= ~IN_ATTACK2;
        set_uc(userCmd, UC_Buttons, buttons);

        new Float:cooldown = ClampFloat(get_pcvar_float(g_pcvarRocketCooldown), 0.35, 5.0);
        if (now - g_lastRocketVolley[id] >= cooldown
            && CountOwnerRockets(id) < ClampInt(get_pcvar_num(g_pcvarRocketMaxActive), 1, 12))
        {
            g_lastRocketVolley[id] = now;
            SpawnHomingRocket(id, -10.0);
            g_secondRocketPending[id] = true;
            g_secondRocketTime[id] = now + ClampFloat(get_pcvar_float(g_pcvarRocketDelay), 0.10, 1.5);
            ShowFactoryLine(id);
        }
    }
    else if (weapon == W_GAUSS && (pressed & IN_ATTACK2))
    {
        g_gaussCorrectionPending[id] = true;
        g_gaussCorrectionTime[id] = now + 0.04;
        ShowFactoryLine(id);
    }

    g_previousButtons[id] = rawButtons;
'''
          text = replace_once(text, old_cmd, new_cmd, 'OnCmdStart rocket flood')

          old_spawn = '''    new entity = engfunc(EngFunc_CreateNamedEntity, engfunc(EngFunc_AllocString, "rpg_rocket"));
    if (!IsTrackable(entity))
    {
        return 0;
    }

    set_pev(entity, pev_origin, origin);
    set_pev(entity, pev_owner, owner);
    dllfunc(DLLFunc_Spawn, entity);
    set_pev(entity, pev_velocity, velocity);

    g_customRocket[entity] = true;
'''

          new_spawn = '''    if (CountOwnerRockets(owner) >= ClampInt(get_pcvar_num(g_pcvarRocketMaxActive), 1, 12))
    {
        return 0;
    }

    // Use a private info_target instead of the native rpg_rocket class.
    // The native class was simultaneously handled by Weapon Lab and the game DLL,
    // producing duplicate touch/explosion paths and entity storms.
    new entity = engfunc(EngFunc_CreateNamedEntity, engfunc(EngFunc_AllocString, "info_target"));
    if (!IsTrackable(entity))
    {
        return 0;
    }

    set_pev(entity, pev_classname, "hldm_comedy_rocket");
    engfunc(EngFunc_SetModel, entity, "models/rpgrocket.mdl");
    set_pev(entity, pev_origin, origin);
    set_pev(entity, pev_owner, owner);
    set_pev(entity, pev_movetype, MOVETYPE_FLY);
    set_pev(entity, pev_solid, SOLID_BBOX);
    set_pev(entity, pev_takedamage, DAMAGE_NO);
    new Float:mins[3] = {-2.0, -2.0, -2.0};
    new Float:maxs[3] = {2.0, 2.0, 2.0};
    engfunc(EngFunc_SetSize, entity, mins, maxs);
    set_pev(entity, pev_velocity, velocity);

    g_customRocket[entity] = true;
'''
          text = replace_once(text, old_spawn, new_spawn, 'custom rocket entity')

          insert_anchor = 'stock SpawnHomingRocket(owner, Float:sideOffset)\n'
          count_stock = '''stock CountOwnerRockets(owner)
{
    new count;
    for (new entity = MaxClients + 1; entity <= MAX_TRACKED; entity++)
    {
        if (g_customRocket[entity] && pev_valid(entity) && g_rocketOwner[entity] == owner)
        {
            count++;
        }
    }
    return count;
}

'''
          text = replace_once(text, insert_anchor, count_stock + insert_anchor, 'CountOwnerRockets insertion')

          text = replace_once(
              text,
              '    g_secondRocketTime[id] = 0.0;\n',
              '    g_secondRocketTime[id] = 0.0;\n    g_lastRocketVolley[id] = -9999.0;\n',
              'reset rocket cooldown',
          )

          path.write_text(text, encoding="utf-8", newline="\n")

          cfg = Path("configs/plugins/hldm_weapon_comedy.cfg")
          cfg_text = cfg.read_text(encoding="utf-8")
          cfg_text = cfg_text.replace("// HLDM Weapon Comedy 2.0.0", "// HLDM Weapon Comedy 2.1.0", 1)
          cfg_text = replace_once(
              cfg_text,
              'hldm_weaponcomedy_rocket_radius "180.0"\n',
              'hldm_weaponcomedy_rocket_radius "180.0"\n'
              'hldm_weaponcomedy_rocket_cooldown "1.25"\n'
              'hldm_weaponcomedy_rocket_max_active "4"\n',
              'weapon comedy cfg safety',
          )
          cfg.write_text(cfg_text, encoding="utf-8", newline="\n")

          # ---------------- Weapon Lab: stop owning hornets/rockets twice ----------------
          path = Path("src/hldm_weapon_lab.sma")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, '#define PLUGIN_VERSION "1.0.0"', '#define PLUGIN_VERSION "1.1.0"', 'weapon lab version')
          text = replace_once(
              text,
              'new g_pcvarHornetRadius;\n',
              'new g_pcvarHornetRadius;\nnew g_pcvarManageHornets;\n',
              'manage hornets cvar declaration',
          )
          text = replace_once(
              text,
              '    g_pcvarHornetRadius = register_cvar("hldm_weaponlab_hornet_radius", "96.0");\n',
              '    g_pcvarHornetRadius = register_cvar("hldm_weaponlab_hornet_radius", "96.0");\n'
              '    g_pcvarManageHornets = register_cvar("hldm_weaponlab_manage_hornets", "0");\n',
              'manage hornets registration',
          )
          text = replace_once(
              text,
              '    if (equal(classname, "hornet"))\n    {\n        TagHornet(entity);\n    }\n',
              '    if (equal(classname, "hornet") && get_pcvar_num(g_pcvarManageHornets))\n    {\n        TagHornet(entity);\n    }\n',
              'spawn hornet ownership gate',
          )
          text = replace_once(
              text,
              '    if (tag == TAG_HORNET)\n',
              '    if (tag == TAG_HORNET && get_pcvar_num(g_pcvarManageHornets))\n',
              'touch hornet ownership gate',
          )
          text = replace_once(
              text,
              '    ProcessHornets(now);\n',
              '    if (get_pcvar_num(g_pcvarManageHornets))\n    {\n        ProcessHornets(now);\n    }\n',
              'tick hornet ownership gate',
          )
          text = replace_once(
              text,
              '    TagHornet(entity);\n    return entity;\n}\n\nstock SpawnHornetBurst',
              '    if (get_pcvar_num(g_pcvarManageHornets))\n    {\n        TagHornet(entity);\n    }\n    return entity;\n}\n\nstock SpawnHornetBurst',
              'manual hornet ownership gate',
          )
          path.write_text(text, encoding="utf-8", newline="\n")

          cfg = Path("configs/plugins/hldm_weapon_lab.cfg")
          cfg_text = cfg.read_text(encoding="utf-8")
          cfg_text = cfg_text.replace("// HLDM Weapon Lab 1.0.0", "// HLDM Weapon Lab 1.1.0", 1)
          cfg_text = replace_once(
              cfg_text,
              'hldm_weaponlab_hornet_radius "96.0"\n',
              'hldm_weaponlab_hornet_radius "96.0"\n'
              '// Dedicated Hornet Policy owns all hornet touch/lifetime/cap logic.\n'
              'hldm_weaponlab_manage_hornets "0"\n',
              'weapon lab manage hornets cfg',
          )
          cfg_text = cfg_text.replace('hldm_weaponlab_rocket_hornets "4"', 'hldm_weaponlab_rocket_hornets "0"', 1)
          cfg.write_text(cfg_text, encoding="utf-8", newline="\n")

          # ---------------- Hornet Policy: explode before native cleanup and throttle wall touches ----------------
          path = Path("src/hldm_hornet_policy.sma")
          text = path.read_text(encoding="utf-8")
          text = replace_once(text, '#define PLUGIN_VERSION "2.0.0"', '#define PLUGIN_VERSION "2.1.0"', 'hornet policy version')
          text = replace_once(
              text,
              'new Float:g_expireTime[MAX_TRACKED + 1];\n',
              'new Float:g_expireTime[MAX_TRACKED + 1];\nnew Float:g_nextWorldTouch[MAX_TRACKED + 1];\n',
              'hornet wall throttle state',
          )
          text = text.replace('register_cvar("hldm_hornetpolicy_lifetime", "4.5")', 'register_cvar("hldm_hornetpolicy_lifetime", "3.20")', 1)

          old_touch = '''    if (IsDamageTarget(other))
    {
        ExplodeHornet(entity);
        return FMRES_SUPERCEDE;
    }

    BounceHornet(entity);
    return FMRES_SUPERCEDE;
'''
          new_touch = '''    if (IsDamageTarget(other))
    {
        ExplodeHornet(entity);
        return FMRES_SUPERCEDE;
    }

    new Float:now = get_gametime();
    if (now >= g_nextWorldTouch[entity])
    {
        g_nextWorldTouch[entity] = now + 0.08;
        BounceHornet(entity);
    }
    return FMRES_SUPERCEDE;
'''
          text = replace_once(text, old_touch, new_touch, 'hornet wall touch throttle')
          text = replace_once(
              text,
              '    g_expireTime[entity] = g_spawnTime[entity] + ClampFloat(get_pcvar_float(g_pcvarLifetime), 0.5, 15.0);\n',
              '    g_expireTime[entity] = g_spawnTime[entity] + ClampFloat(get_pcvar_float(g_pcvarLifetime), 0.5, 15.0);\n'
              '    g_nextWorldTouch[entity] = 0.0;\n',
              'hornet touch throttle init',
          )
          text = replace_once(
              text,
              '    g_expireTime[entity] = 0.0;\n',
              '    g_expireTime[entity] = 0.0;\n    g_nextWorldTouch[entity] = 0.0;\n',
              'hornet touch throttle reset',
          )
          path.write_text(text, encoding="utf-8", newline="\n")

          cfg = Path("configs/plugins/hldm_hornet_policy.cfg")
          cfg_text = cfg.read_text(encoding="utf-8")
          cfg_text = cfg_text.replace("// HLDM Hornet Policy 2.0.0", "// HLDM Hornet Policy 2.1.0", 1)
          cfg_text = cfg_text.replace('hldm_hornetpolicy_lifetime "4.5"', 'hldm_hornetpolicy_lifetime "3.20"', 1)
          cfg.write_text(cfg_text, encoding="utf-8", newline="\n")
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hldm_weapon_comedy.sma src/hldm_weapon_lab.sma src/hldm_hornet_policy.sma configs/plugins/hldm_weapon_comedy.cfg configs/plugins/hldm_weapon_lab.cfg configs/plugins/hldm_hornet_policy.cfg
          git commit -m "Stop rocket and hornet entity storms"
          git push origin HEAD:hotfix/entity-storm-v2
