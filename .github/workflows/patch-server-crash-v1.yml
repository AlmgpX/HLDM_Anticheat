name: Patch server crash v1

on:
  push:
    branches: ["hotfix/server-crash-v1"]
    paths:
      - "docs/SERVER_CRASH_PATCH_TRIGGER.md"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/server-crash-v1

      - name: Disable unsafe runtime population and silence shutdown vault errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cfg = Path("configs/plugins/hldm_population_manager.cfg")
          text = cfg.read_text(encoding="utf-8")
          text = text.replace('hldm_population_bots_enabled "1"', 'hldm_population_bots_enabled "0"', 1)
          text = text.replace('hldm_population_monsters_enabled "1"', 'hldm_population_monsters_enabled "0"', 1)
          text = text.replace(
              '// Half-Life has no built-in bots; default command targets ParaBot-style installs.\n',
              '// Disabled until a compatible bot DLL providing addbot is installed.\n'
              '// Half-Life has no built-in bots; default command targets ParaBot-style installs.\n',
              1,
          )
          text = text.replace(
              '// Passive monster population around unused deathmatch spawn points.\n',
              '// Disabled: native monster Spawn() tries to precache sounds after map load and crashes GoldSrc.\n'
              '// A pooled/custom monster implementation is required before this can be safely enabled.\n',
              1,
          )
          cfg.write_text(text, encoding="utf-8", newline="\n")

          replacements = {
              Path("src/hldm_runtime_guard.sma"): '''public plugin_end()\n{\n    // nVault closes plugin-owned handles during module shutdown. Explicitly\n    // closing here can run after nVault teardown on listen-server shutdown.\n    g_vault = INVALID_HANDLE;\n}\n''',
              Path("src/hldm_meat_demon.sma"): '''public plugin_end()\n{\n    // nVault closes plugin-owned handles during module shutdown. Explicitly\n    // closing here can run after nVault teardown on listen-server shutdown.\n    g_chaosVault = INVALID_HANDLE;\n}\n''',
          }

          for path, replacement in replacements.items():
              text = path.read_text(encoding="utf-8")
              start = text.index("public plugin_end()")
              next_public = text.index("\npublic ", start + 1)
              text = text[:start] + replacement + text[next_public + 1:]
              path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/plugins/hldm_population_manager.cfg src/hldm_runtime_guard.sma src/hldm_meat_demon.sma
          git commit -m "Prevent listen-server crash from runtime monster spawning"
          git push origin HEAD:hotfix/server-crash-v1
