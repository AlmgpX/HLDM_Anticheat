name: Fix Silent Misery

on:
  push:
    branches: ["feature/silent-misery-v1"]
    paths:
      - "docs/SILENT_MISERY_FIX_TRIGGER.md"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/silent-misery-v1

      - name: Repair Pawn hostname quoting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/hldm_silent_misery.sma")
          text = path.read_text(encoding="utf-8")
          old = '        server_cmd("hostname ^\\"%s^\\"", hostname);\n'
          new = '        server_cmd("hostname ^"%s^"", hostname);\n'
          if old not in text:
              raise SystemExit("Hostname line anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hldm_silent_misery.sma
          git commit -m "Fix Silent Misery hostname quoting"
          git push origin HEAD:feature/silent-misery-v1
