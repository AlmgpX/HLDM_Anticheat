name: Run entity storm patcher

on:
  push:
    branches: ["main"]
    paths:
      - "docs/ENTITY_STORM_MAIN_TRIGGER.md"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/entity-storm-v2

      - name: Extract and run branch patcher
        shell: bash
        run: |
          awk '
            /python3 - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/patch-entity-storm-v2.yml > /tmp/entity_storm_patch.py
          test -s /tmp/entity_storm_patch.py
          python3 /tmp/entity_storm_patch.py

      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hldm_weapon_comedy.sma src/hldm_weapon_lab.sma src/hldm_hornet_policy.sma configs/plugins/hldm_weapon_comedy.cfg configs/plugins/hldm_weapon_lab.cfg configs/plugins/hldm_hornet_policy.cfg
          git commit -m "Stop rocket and hornet entity storms"
          git push origin HEAD:hotfix/entity-storm-v2
