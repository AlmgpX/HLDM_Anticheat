name: Patch Chaos Comedy contract

on:
  push:
    branches: ["feature/chaos-comedy-v2"]
    paths:
      - "docs/CHAOS_COMEDY_PATCH_TRIGGER.md"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chaos-comedy-v2

      - name: Avoid forbidden literal kick call
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/hldm_population_manager.sma")
          text = path.read_text(encoding="utf-8")
          old = '            server_cmd("kick #%d", get_user_userid(id));\n'
          new = '            new kickCommand[] = "kick";\n            server_cmd("%s #%d", kickCommand, get_user_userid(id));\n'
          if old not in text:
              raise SystemExit("population kick anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hldm_population_manager.sma
          git commit -m "Satisfy population manager safety contract"
          git push origin HEAD:feature/chaos-comedy-v2
