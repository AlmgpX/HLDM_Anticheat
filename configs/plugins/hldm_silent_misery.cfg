// HLDM Silent Misery 1.0.0

hldm_misery_enabled "1"

// Guaranteed server title on map/server startup.
hldm_misery_hostname "ZOV ZIP ZONA"

// Replace grenade world models with the head/skull body from models/hgibs.mdl.
hldm_misery_skull_grenades "1"

// Silent punishment probabilities and multipliers.
hldm_misery_ghost_hit_chance "18"
hldm_misery_frailty_scale "1.35"
hldm_misery_frailty_low_health_scale "1.75"
hldm_misery_frailty_threshold "35.0"

hldm_misery_choke_chance "11"
hldm_misery_choke_duration "0.11"

hldm_misery_stutter_min_interval "1.8"
hldm_misery_stutter_max_interval "4.8"
hldm_misery_stutter_duration "0.12"
hldm_misery_stutter_factor "0.12"

hldm_misery_footstep_min_interval "1.9"
hldm_misery_footstep_max_interval "4.4"

hldm_misery_shadow_degrees "1.15"
hldm_misery_shadow_jam_chance "16"

hldm_misery_admin_immunity "1"
