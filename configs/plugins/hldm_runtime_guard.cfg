// HLDM Runtime Guard 1.0.0

hldm_guard_enabled "1"

// Final raw damage dealt by a marked client per hit.
hldm_guard_damage_cap "1.0"

// Kill once as soon as the guard sees a new punishment mark.
hldm_guard_slay_on_mark "1"

// Automatically enable projected x-ray for administrators.
hldm_guard_xray_auto "1"
hldm_guard_xray_distance "16384.0"

// Enforced noclip speed for administrators.
hldm_guard_noclip_speed "1000.0"

// Publicly announce manual integrity failures.
hldm_guard_public_notice "1"
