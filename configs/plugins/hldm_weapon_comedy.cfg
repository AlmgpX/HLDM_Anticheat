// HLDM Weapon Comedy 2.4.0

hldm_weaponcomedy_enabled "1"

// Python / revolver: sixteen visual hitscan bolt tracers with shotgun spread.
// No native crossbow_bolt entities are created, so no chained explosions/snarks.
hldm_weaponcomedy_python_self_damage "4.0"
hldm_weaponcomedy_python_self_damage_lethal "0"
// Keep native shot for ammo/animation/sound, but suppress exact PvP damage.
hldm_weaponcomedy_python_suppress_stock_pvp_damage "1"
hldm_weaponcomedy_python_pellets "16"
hldm_weaponcomedy_python_pellet_damage "3.0"
hldm_weaponcomedy_python_spread "0.16"
hldm_weaponcomedy_python_range "4096.0"
hldm_weaponcomedy_python_recoil "220.0"

// MP5 secondary is intentionally untouched. Quiet betrayal is handled by
// Weapon Lab only when the shooter is under silent punishment.

// Gauss correction replaces endless backward recoil with down/side impulse.
hldm_weaponcomedy_gauss_impulse "290.0"

// Per-weapon factory comedy for Python, RPG and Gauss. Egon has its own plugin.
hldm_weaponcomedy_text_chance "38"
