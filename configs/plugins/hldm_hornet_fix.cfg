// HLDM Hornet Hard Fix 1.0.0

hldm_hornetfix_enabled "1"

// Maximum simultaneously alive Hornet Gun projectiles per player.
hldm_hornetfix_max_active "10"

// Slightly before the stock 3.5-second multiplayer removal so the explosion
// always happens instead of the native silent cleanup winning the same frame.
hldm_hornetfix_lifetime "3.35"

hldm_hornetfix_damage "40.0"
hldm_hornetfix_radius "96.0"

// Prevent a newly spawned hornet from exploding against its owner immediately.
hldm_hornetfix_owner_grace "0.25"

// Set to 1 only for server-log diagnostics.
hldm_hornetfix_debug "0"
