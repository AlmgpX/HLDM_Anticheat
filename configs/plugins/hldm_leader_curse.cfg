// HLDM Leader Curse 1.0.0

hldm_leadercurse_enabled "1"
hldm_leadercurse_admin_immunity "1"
hldm_leadercurse_minimum_others "1"

// Score lead over the average frag count of all other connected players.
hldm_leadercurse_threshold_ammo "5"
hldm_leadercurse_threshold_steps "10"
hldm_leadercurse_threshold_selfkill "15"

// At +5 lead, ordinary ammo pickups may become explosive crossbow ammunition.
hldm_leadercurse_ammo_conversion_chance "28"
hldm_leadercurse_ammo_multiplier "3"

// Threshold announcements are public; individual recurring taunts are target-only.
hldm_leadercurse_public_thresholds "1"
hldm_leadercurse_public_ammo "0"

// Experimental-server announcement and recurring target taunts.
hldm_leadercurse_notice_interval "90.0"
hldm_leadercurse_taunt_min "12.0"
hldm_leadercurse_taunt_max "20.0"
