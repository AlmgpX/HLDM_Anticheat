// HLDM Admin Tools 1.2.0
// Overlay, debug scanner and menus are visible only to administrators.

hldm_admin_enabled "1"
hldm_admin_default_mode "3"
hldm_admin_through_walls "1"
hldm_admin_require_alive "0"
hldm_admin_max_distance "8192.0"
hldm_admin_line_life "4"
hldm_admin_line_width "2"
hldm_admin_aim_hud "1"

// Automatically enable wall ESP and scanner after an administrator joins.
hldm_admin_auto_enable "1"
hldm_admin_scanner_hud "1"

// Manual HARD TRAP announces the correction to all connected clients.
hldm_admin_public_punish "1"

// F5 debug free-flight for administrators.
hldm_admin_allow_noclip "1"
