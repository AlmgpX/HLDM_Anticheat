// Meat fountain frequency in seconds.
hldm_chaos_meat_interval "0.65"

// Karma protection: blocked damage is reflected and also heals the protected player.
hldm_chaos_reflect_scale "1.25"
hldm_chaos_heal_scale "1.0"
hldm_chaos_protected_max_health "200.0"
hldm_chaos_protect_ignore_admins "1"

// Public chat notices.
hldm_chaos_public_punish "1"
hldm_chaos_public_protect "0"

// Random velocity/punch-angle insanity for punished players.
hldm_chaos_weird_pulse "1"
