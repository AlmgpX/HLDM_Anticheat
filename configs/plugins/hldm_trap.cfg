// HLDM Trap 0.2.0
// Loaded by AutoExecConfig from addons/amxmodx/configs/plugins/hldm_trap.cfg.

// Master switch. amx_trap_stop sets this to 0 without deleting target records.
hldm_trap_enabled "1"

// Remember valid SteamID/ValveID targets in nVault.
hldm_trap_persist "1"

// Safety rails against turning the server owner into collateral damage.
hldm_trap_protect_admins "1"
hldm_trap_allow_self "0"
hldm_trap_allow_bots "0"

// Damage scales at full HARD intensity. SOFT uses half the distance from 1.0.
hldm_trap_outgoing_scale "0.08"
hldm_trap_incoming_scale "1.75"

// Percent chance per relevant user command. RECOVERY temporarily disables these effects.
hldm_trap_jump_fail_chance "12"
hldm_trap_attack_fail_chance "6"
hldm_trap_attack2_fail_chance "8"
hldm_trap_strafe_flip_chance "4"

// Alternating punishment and false-recovery windows.
hldm_trap_punish_min_seconds "18"
hldm_trap_punish_max_seconds "35"
hldm_trap_recovery_min_seconds "7"
hldm_trap_recovery_max_seconds "15"

// Personal HUD messages are sent only to trapped clients.
hldm_trap_hud "1"

// Global server policy against custom one-pixel player models.
hldm_trap_force_standard_models "1"
hldm_trap_forced_model "gordon"

// Automatically mark a client after rejected custom-model attempts.
// Set to 0 to replace custom models without applying the trap.
hldm_trap_auto_trap_custom_models "1"
hldm_trap_custom_model_threshold "1"
