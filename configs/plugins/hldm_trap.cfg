// HLDM Trap 0.3.0 aggressive profile
hldm_trap_enabled "1"
hldm_trap_persist "1"

hldm_trap_protect_admins "1"
hldm_trap_allow_self "0"
hldm_trap_allow_bots "0"

// HARD phase: effectively remove outgoing damage and amplify incoming damage.
hldm_trap_outgoing_scale "0.0"
hldm_trap_incoming_scale "3.0"

// Frequent input sabotage for trapped clients.
hldm_trap_jump_fail_chance "35"
hldm_trap_attack_fail_chance "25"
hldm_trap_attack2_fail_chance "30"
hldm_trap_strafe_flip_chance "15"

// Long punishment windows with only brief false recovery.
hldm_trap_punish_min_seconds "45"
hldm_trap_punish_max_seconds "90"
hldm_trap_recovery_min_seconds "2"
hldm_trap_recovery_max_seconds "4"

hldm_trap_hud "1"

// Reject one-pixel and other custom player models immediately.
hldm_trap_force_standard_models "1"
hldm_trap_forced_model "gordon"
hldm_trap_auto_trap_custom_models "1"
hldm_trap_custom_model_threshold "1"
