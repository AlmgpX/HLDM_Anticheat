// HLDM Population Manager 1.0.0

hldm_population_enabled "1"
hldm_population_hostname "Alex first HL server | playing with brother"

// Bots: floor((maxplayers - 2 reserved humans) * 0.50).
// Disabled until a compatible bot DLL providing addbot is installed.
// Half-Life has no built-in bots; default command targets ParaBot-style installs.
hldm_population_bots_enabled "0"
hldm_population_human_reserve "2"
hldm_population_bot_fraction "0.50"
hldm_population_bot_add_command "addbot"
hldm_population_bot_interval "8.0"

// Disabled: native monster Spawn() tries to precache sounds after map load and crashes GoldSrc.
// A pooled/custom monster implementation is required before this can be safely enabled.
hldm_population_monsters_enabled "0"
hldm_population_monster_max "6"
hldm_population_monster_interval "18.0"
hldm_population_monster_safe_radius "320.0"
hldm_population_headcrab_weight "65"
hldm_population_zombie_weight "35"
