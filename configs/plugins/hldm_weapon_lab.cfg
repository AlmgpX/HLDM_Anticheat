// HLDM Weapon Lab 1.0.0

hldm_weaponlab_enabled "1"

// Global weapon mutations. Set 0 to keep only administrator quiet modes.
hldm_weaponlab_global_mutators "1"
hldm_weaponlab_weapon_extras "1"

// Quiet punishment modes. No target HUD, chat or public announcement is sent.
hldm_weaponlab_quiet_damage_scale "0.01"
hldm_weaponlab_quiet_primary_misfire "12"
hldm_weaponlab_quiet_secondary_misfire "18"
hldm_weaponlab_quiet_drift_degrees "2.2"
hldm_weaponlab_quiet_admin_immunity "1"

// Hornet gun: both fire modes create exploding hornets.
hldm_weaponlab_hornet_max "10"
hldm_weaponlab_hornet_lifetime "3.5"
hldm_weaponlab_hornet_damage "40.0"
hldm_weaponlab_hornet_radius "96.0"

// Approximately five metres in GoldSrc scale.
hldm_weaponlab_tripmine_radius "200.0"

// Grenades and RPG rockets hatch hornets near detonation/impact.
hldm_weaponlab_grenade_hornets "3"
hldm_weaponlab_rocket_hornets "4"

// Snark limits and secondary-fire alpha snark.
hldm_weaponlab_snark_max "30"
hldm_weaponlab_snark_pop_hornets "2"
hldm_weaponlab_snark_alt_cooldown "4.0"

// Crossbow secondary attack detonates its owner.
hldm_weaponlab_crossbow_alt_suicide "1"
