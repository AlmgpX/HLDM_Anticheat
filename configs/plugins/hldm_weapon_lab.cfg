// HLDM Weapon Lab 1.2.0

hldm_weaponlab_enabled "1"

// Global weapon mutations. Set 0 to keep only administrator quiet modes.
hldm_weaponlab_global_mutators "1"
hldm_weaponlab_weapon_extras "1"

// Quiet punishment modes. No target HUD, chat or public announcement is sent.
hldm_weaponlab_quiet_damage_scale "0.01"
hldm_weaponlab_quiet_primary_misfire "12"
hldm_weaponlab_quiet_secondary_misfire "18"
hldm_weaponlab_quiet_drift_degrees "2.2"
hldm_weaponlab_quiet_admin_immunity "1"

// Hornet gun values are retained for Weapon Lab-created hornets. The dedicated
// hldm_hornet_fix plugin enforces the native primary/secondary cap and explosions.
hldm_weaponlab_hornet_max "10"
hldm_weaponlab_hornet_lifetime "3.5"
hldm_weaponlab_hornet_damage "40.0"
hldm_weaponlab_hornet_radius "96.0"
// Dedicated Hornet Policy owns all hornet touch/lifetime/cap logic.
hldm_weaponlab_manage_hornets "0"

// Approximately five metres in GoldSrc scale.
hldm_weaponlab_tripmine_radius "200.0"

// Grenade hornets are now created after the blast by hldm_weapon_payloads,
// otherwise the native explosion kills them in the same frame.
hldm_weaponlab_grenade_hornets "0"
hldm_weaponlab_rocket_hornets "0"

// MP5 underbarrel stays stock for ordinary players. Hand grenades and
// MP5 contact grenades return only under QUIET_BETRAYAL.
// RPG comedy modifies the existing rocket only; no duplicate rockets.
hldm_weaponlab_rpg_wobble_chance "55"
hldm_weaponlab_rpg_wobble_strength "42.0"

// Snark limits and secondary-fire alpha snark.
hldm_weaponlab_snark_max "30"
hldm_weaponlab_snark_pop_hornets "2"
hldm_weaponlab_snark_alt_cooldown "4.0"

// Crossbow secondary attack still detonates its owner. Ordinary bolt impact
// gets the delayed snark payload from hldm_weapon_payloads.
hldm_weaponlab_crossbow_alt_suicide "1"
