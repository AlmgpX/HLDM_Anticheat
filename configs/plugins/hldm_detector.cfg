// HLDM Anticheat Detector 1.0.0
// Loaded from addons/amxmodx/configs/plugins/hldm_detector.cfg.

// 0 = disabled, 1 = observe/log only, 2 = automatically call amx_trap.
hldm_ac_enabled "1"
hldm_ac_mode "2"

// Ignore the first seconds after joining and scan visible opponents at 20 Hz.
hldm_ac_warmup_seconds "20.0"
hldm_ac_visibility_scan_interval "0.05"
hldm_ac_visible_dot_min "0.94"

// Suspicion score.
hldm_ac_score_decay_per_second "1.5"
hldm_ac_score_maximum "250.0"
hldm_ac_auto_threshold "100.0"
hldm_ac_alert_threshold "60.0"
hldm_ac_alert_cooldown_seconds "10.0"
hldm_ac_auto_cooldown_seconds "60.0"
hldm_ac_minimum_categories "2"
hldm_ac_minimum_events "5"

// Server owners and admins are excluded by default.
hldm_ac_exempt_admins "1"

// Large view-angle jump followed by a shot that lands on a player.
hldm_ac_snap_degrees "35.0"
hldm_ac_snap_max_cmd_interval "0.08"
hldm_ac_snap_points "18.0"

// Shot lands on a player within this time after the opponent first becomes visible.
hldm_ac_reaction_milliseconds "90.0"
hldm_ac_reaction_points "24.0"

// Shot switches between two different players in a very short window.
hldm_ac_switch_degrees "30.0"
hldm_ac_switch_window_seconds "0.35"
hldm_ac_switch_points "20.0"

// Impossible usercmd angles are a strong independent signal.
hldm_ac_invalid_angle_points "100.0"

// Detailed event file: addons/amxmodx/logs/hldm_anticheat_events.log
hldm_ac_log_events "1"
