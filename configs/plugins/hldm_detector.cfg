// HLDM Anticheat Detector 1.1.0 aggressive profile
// 0 = disabled, 1 = observe/log only, 2 = automatic trap.
hldm_ac_enabled "1"
hldm_ac_mode "2"

// Short warmup and frequent visibility scans.
hldm_ac_warmup_seconds "5.0"
hldm_ac_visibility_scan_interval "0.04"
hldm_ac_visible_dot_min "0.93"

// Aggressive scoring. Requires multiple independent signals, but reacts quickly.
hldm_ac_score_decay_per_second "0.5"
hldm_ac_score_maximum "300.0"
hldm_ac_auto_threshold "55.0"
hldm_ac_alert_threshold "25.0"
hldm_ac_alert_cooldown_seconds "3.0"
hldm_ac_auto_cooldown_seconds "5.0"
hldm_ac_minimum_categories "2"
hldm_ac_minimum_events "3"

// Server owners and admins remain excluded.
hldm_ac_exempt_admins "1"

hldm_ac_snap_degrees "28.0"
hldm_ac_snap_max_cmd_interval "0.10"
hldm_ac_snap_points "25.0"

hldm_ac_reaction_milliseconds "110.0"
hldm_ac_reaction_points "30.0"

hldm_ac_switch_degrees "24.0"
hldm_ac_switch_window_seconds "0.45"
hldm_ac_switch_points "28.0"

hldm_ac_invalid_angle_points "250.0"
hldm_ac_log_events "1"
