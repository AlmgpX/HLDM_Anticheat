// HLDM Weapon Payloads 1.1.0

hldm_payload_enabled "1"

// Satchel snarks are hidden and invulnerable until the satchel blast finishes.
hldm_payload_satchel_release_delay "0.85"
hldm_payload_satchel_detect_radius "96.0"

// Hand-grenade payload only. MP5 underbarrel contact grenades stay stock.
hldm_payload_grenade_hornets "5"
hldm_payload_grenade_spawn_delay "0.14"
hldm_payload_hornet_speed "720.0"
hldm_payload_hornet_turn_speed "0.42"

// Crossbow impact gets a guaranteed mini explosion and delayed snark hatch.
hldm_payload_crossbow_snarks "3"
hldm_payload_crossbow_spawn_delay "0.22"
hldm_payload_crossbow_explosion_damage "35.0"
hldm_payload_crossbow_explosion_radius "96.0"

hldm_payload_debug "0"
