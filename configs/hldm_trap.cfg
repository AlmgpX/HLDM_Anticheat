// HLDM Trap 0.1.0
// Ordinary players are untouched except for the optional standard-model guard.

hldm_trap_enabled "1"
hldm_trap_persist "1"

// Target damage output and damage received during punishment phases.
hldm_trap_outgoing_scale "0.08"
hldm_trap_incoming_scale "1.75"

// Percent chance per relevant user command. Recovery phases temporarily disable these effects.
hldm_trap_jump_fail_chance "12"
hldm_trap_attack_fail_chance "6"
hldm_trap_strafe_flip_chance "4"

// Alternating punishment and false-recovery windows.
hldm_trap_punish_min_seconds "18"
hldm_trap_punish_max_seconds "35"
hldm_trap_recovery_min_seconds "7"
hldm_trap_recovery_max_seconds "15"

// Personal HUD messages are sent only to trapped clients.
hldm_trap_hud "1"

// Reject non-standard custom player models such as one-pixel models.
hldm_trap_force_standard_models "1"
hldm_trap_forced_model "gordon"
